<style>
  body { font-family: Arial, sans-serif; padding: 12px; }
  #status { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
  #status.dirty { background: #FBE9DA; color: #8A3E06; }
  #status.clean { background: #E4F2EE; color: #0F5347; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #1C8E79; color: white; font-size: 14px; cursor: pointer; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #msg { margin-top: 10px; font-size: 12px; color: #666; }
</style>
<div id="status">Cargando…</div>
<button id="btn" disabled>Publicar a GitHub</button>
<div id="msg"></div>
<script>
  function refresh() {
    google.script.run.withSuccessHandler(function (s) {
      var statusEl = document.getElementById('status');
      var btn = document.getElementById('btn');
      if (s.dirty) {
        statusEl.textContent = '⚠️ Hay cambios sin publicar';
        statusEl.className = 'dirty';
        btn.disabled = false;
      } else {
        statusEl.textContent = '✅ Todo publicado';
        statusEl.className = 'clean';
        btn.disabled = true;
      }
    }).getStatus();
  }

  document.getElementById('btn').addEventListener('click', function () {
    var btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('msg').textContent = 'Publicando…';
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('msg').textContent = '✅ Publicado: ' + r.curso;
        refresh();
      })
      .withFailureHandler(function (err) {
        document.getElementById('msg').textContent = '❌ Error: ' + err.message;
        btn.disabled = false;
      })
      .publish();
  });

  refresh();
  setInterval(refresh, 4000);
</script>
