<style>
  body { font-family: Arial, sans-serif; padding: 12px; }
  #status { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
  #status.dirty { background: #FBE9DA; color: #8A3E06; }
  #status.clean { background: #E4F2EE; color: #0F5347; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #1C8E79; color: white; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.ghost { background: #fff; color: #1C8E79; border: 1px solid #1C8E79; }
  button.danger { background: #fff; color: #B3261E; border: 1px solid #B3261E; }
  button.secondary { background: #fff; color: #444; border: 1px solid #ccc; }
  #msg { margin-top: 4px; margin-bottom: 16px; font-size: 12px; color: #666; white-space: pre-wrap; }
  h3 { font-size: 13px; margin: 18px 0 8px; border-top: 1px solid #ddd; padding-top: 14px; }
  input[type="date"] { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .testmsg { margin-top: 4px; margin-bottom: 16px; font-size: 11px; color: #444; background: #f5f5f5; border-radius: 6px; padding: 8px; white-space: pre-wrap; }
</style>

<div id="status">Cargando…</div>

<button id="btnValidate" class="secondary">🔍 Validar</button>
<div id="msgValidate" class="testmsg" style="display:none"></div>

<button id="btn" disabled>Publicar a GitHub</button>
<div id="msg"></div>

<button id="btnRevert" class="danger">↩️ Deshacer cambios (volver a lo publicado)</button>
<div id="msgRevert" class="testmsg" style="display:none"></div>

<h3>Forzar Notificaciones 📤</h3>

<button id="btnWeeklyNext" class="ghost">Enviar semanal — próxima semana</button>
<button id="btnWeeklyThis" class="ghost">Enviar semanal — de esta semana</button>
<div id="msgWeekly" class="testmsg" style="display:none"></div>

<input type="date" id="dailyDate">
<button id="btnDaily" class="ghost">Enviar diario para esa fecha</button>
<div id="msgDaily" class="testmsg" style="display:none"></div>

<script>
  function refresh() {
    google.script.run.withSuccessHandler(function (s) {
      var statusEl = document.getElementById('status');
      var btn = document.getElementById('btn');
      if (s.dirty) {
        statusEl.textContent = '⚠️ Hay cambios sin publicar';
        statusEl.className = 'dirty';
        btn.disabled = false;
      } else {
        statusEl.textContent = '✅ Todo publicado';
        statusEl.className = 'clean';
        btn.disabled = true;
      }
    }).getStatus();
  }

  document.getElementById('btn').addEventListener('click', function () {
    var btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('msg').textContent = 'Publicando…';
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('msg').textContent = '✅ Publicado: ' + r.curso;
        refresh();
      })
      .withFailureHandler(function (err) {
        document.getElementById('msg').textContent = '❌ Error: ' + err.message;
        btn.disabled = false;
      })
      .publish();
  });

  function showResult(boxId, r) {
    var box = document.getElementById(boxId);
    box.style.display = 'block';
    var lines = [];
    lines.push(r.sent ? '✅ Enviado' : '⚠️ No se envió: ' + r.reason);
    if (r.kid) lines.push('Niño/a: ' + r.kid);
    if (r.phones) lines.push('A: ' + r.phones.join(', '));
    if (r.message) lines.push('\n--- Mensaje ---\n' + r.message);
    box.textContent = lines.join('\n');
  }

  function runTest(fn, args, boxId, button) {
    button.disabled = true;
    var box = document.getElementById(boxId);
    box.style.display = 'block';
    box.textContent = 'Enviando…';
    google.script.run
      .withSuccessHandler(function (r) {
        showResult(boxId, r);
        button.disabled = false;
      })
      .withFailureHandler(function (err) {
        box.textContent = '❌ Error: ' + err.message;
        button.disabled = false;
      })[fn].apply(null, args);
  }

  document.getElementById('btnValidate').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var box = document.getElementById('msgValidate');
    box.style.display = 'block';
    box.textContent = 'Revisando…';
    google.script.run
      .withSuccessHandler(function (r) {
        var lines = [];
        if (!r.errors.length && !r.warnings.length) {
          lines.push('✅ Todo OK, no se encontraron problemas.');
        } else {
          if (r.errors.length) {
            lines.push('❌ Errores (bloquean "Publicar a GitHub"):');
            r.errors.forEach(function (e) { lines.push('  • ' + e); });
          }
          if (r.warnings.length) {
            if (r.errors.length) lines.push('');
            lines.push('⚠️ Avisos (no bloquean, pero conviene revisar):');
            r.warnings.forEach(function (w) { lines.push('  • ' + w); });
          }
        }
        box.textContent = lines.join('\n');
        btn.disabled = false;
      })
      .withFailureHandler(function (err) {
        box.textContent = '❌ Error al validar: ' + err.message;
        btn.disabled = false;
      })
      .validateData();
  });

  document.getElementById('btnRevert').addEventListener('click', function () {
    var ok = confirm(
      'Esto va a reemplazar Rotación, Colaciones, Cierres, Historial, Eventos, Adjuntos, Restricciones y Avisos ' +
      'con lo que hay AHORA MISMO publicado en GitHub, descartando cualquier cambio sin publicar.\n\n' +
      'Contactos, Notificaciones, Alias e ID de Grupo WhatsApp no se tocan.\n\n¿Continuar?'
    );
    if (!ok) return;
    var btn = this;
    btn.disabled = true;
    var box = document.getElementById('msgRevert');
    box.style.display = 'block';
    box.textContent = 'Restaurando…';
    google.script.run
      .withSuccessHandler(function (r) {
        box.textContent = '✅ Restaurado a lo publicado (' + r.curso + ')';
        btn.disabled = false;
        refresh();
      })
      .withFailureHandler(function (err) {
        box.textContent = '❌ Error: ' + err.message;
        btn.disabled = false;
      })
      .revertFromGithub();
  });

  document.getElementById('btnWeeklyNext').addEventListener('click', function () {
    runTest('testWeekly', ['next'], 'msgWeekly', this);
  });
  document.getElementById('btnWeeklyThis').addEventListener('click', function () {
    runTest('testWeekly', ['this'], 'msgWeekly', this);
  });
  document.getElementById('btnDaily').addEventListener('click', function () {
    var date = document.getElementById('dailyDate').value;
    if (!date) { alert('Elige una fecha primero.'); return; }
    runTest('testDaily', [date], 'msgDaily', this);
  });

  refresh();
  setInterval(refresh, 4000);
</script>
