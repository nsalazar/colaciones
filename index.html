<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F6F1">
<title>Colación compartida</title>
<link rel="icon" href="assets/huelquen-icon.webp" type="image/webp">
<link rel="icon" href="assets/huelquen-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/huelquen-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap">

  <header class="head">
    <div class="head-text">
      <div class="brand">
        <img class="mark" src="assets/huelquen-icon.webp" alt="" aria-hidden="true">
        <span class="eyebrow-wrap">
          <select id="courseSelect" class="mini-select" aria-label="Curso"></select>
        </span>
      </div>
      <h1>Colación compartida</h1>
      <p class="sub" id="hoy"></p>
    </div>
    <div class="kid-picker-mini">
      <select id="kidSelect" class="mini-select" title="Se guarda solo en este teléfono, para destacar el turno de tu hijo o hija en el calendario.">
        <option value="">Mi hijo/a…</option>
      </select>
    </div>
  </header>

  <section class="mine" id="mine" hidden>
    <p class="mine-lead" id="mineLead"></p>
    <p class="mine-meal" id="mineMeal"></p>
  </section>

  <nav class="monthnav">
    <button type="button" id="prev" class="stepper" aria-label="Mes anterior">‹</button>
    <p class="monthlabel" id="monthlabel"></p>
    <button type="button" id="next" class="stepper" aria-label="Mes siguiente">›</button>
  </nav>

  <table class="cal">
    <thead>
      <tr id="legend"></tr>
    </thead>
    <tbody id="calBody"></tbody>
  </table>

  <div class="rowbtns">
    <button type="button" id="today" class="ghost">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <circle cx="12" cy="16" r="2" fill="currentColor" stroke="none"></circle>
      </svg>
      Volver a hoy
    </button>
    <button type="button" id="share" class="ghost">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
      Compartir el mes
    </button>
  </div>

  <section class="month-events" id="monthEvents" hidden>
    <h2>Próximos eventos</h2>
    <ul id="monthEventsList"></ul>
  </section>

  <section class="avisos">
    <h2>Avisos</h2>
    <ul id="avisos"></ul>
  </section>

  <section class="avisos">
    <h2>Restricciones alimenticias</h2>
    <ul id="restrictions"></ul>
  </section>

  <p class="err" id="err" hidden></p>

</main>

<script src="app.js"></script>
</body>
</html>
