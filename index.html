<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F4EC">
<title>Colación compartida</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap">

  <header class="head">
    <h1 id="curso">Colación compartida</h1>
    <p class="sub" id="hoy"></p>
  </header>

  <section class="mine" id="mine" hidden>
    <p class="mine-lead" id="mineLead"></p>
    <p class="mine-meal" id="mineMeal"></p>
  </section>

  <nav class="weeknav">
    <button type="button" id="prev" class="stepper" aria-label="Semana anterior">‹</button>
    <p class="weeklabel" id="weeklabel"></p>
    <button type="button" id="next" class="stepper" aria-label="Semana siguiente">›</button>
  </nav>

  <ol class="days" id="days"></ol>

  <div class="rowbtns">
    <button type="button" id="today" class="ghost">Volver a esta semana</button>
    <button type="button" id="share" class="ghost">Compartir la semana</button>
  </div>

  <section class="avisos">
    <h2>Avisos</h2>
    <ul id="avisos"></ul>
  </section>

  <section class="picker">
    <label for="kidSelect">¿Quién es tu hijo o hija?</label>
    <p class="hint">Se guarda solo en este teléfono, para avisarte cuándo te toca.</p>
    <select id="kidSelect">
      <option value="">Elegir…</option>
    </select>
  </section>

  <p class="err" id="err" hidden></p>

</main>

<script src="app.js"></script>
</body>
</html>
